<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#111"/>
  
  <rect x="50" y="80" width="300" height="170" rx="15" fill="#111"/>
  <!-- Joystick base -->
  <circle cx="150" cy="165" r="50" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <circle cx="150" cy="165" r="35" fill="#222"/>
  <!-- Joystick stick -->
  <circle cx="150" cy="165" r="20" fill="#333"/>
  <circle cx="150" cy="153" r="15" fill="#444"/>
  <circle cx="150" cy="150" r="10" fill="#e52a2a"/>
  <!-- Buttons A B -->
  <circle cx="280" cy="145" r="22" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <circle cx="280" cy="145" r="15" fill="#e52a2a"/>
  <text x="280" y="150" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">A</text>
  <circle cx="320" cy="175" r="18" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  <circle cx="320" cy="175" r="12" fill="#e52a2a"/>
  <text x="320" y="180" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">B</text>
  <!-- Small buttons -->
  <rect x="195" y="155" width="28" height="12" rx="3" fill="#333"/>
  <rect x="230" y="155" width="28" height="12" rx="3" fill="#333"/>
  <text x="209" y="164" font-family="Arial" font-size="7" fill="#aaa" text-anchor="middle">SELECT</text>
  <text x="244" y="164" font-family="Arial" font-size="7" fill="#aaa" text-anchor="middle">START</text>
  <!-- Turbo sliders -->
  <rect x="195" y="120" width="60" height="8" rx="4" fill="#222" stroke="#444" stroke-width="1"/>
  <rect x="210" y="117" width="10" height="14" rx="2" fill="#666"/>
  <!-- NES logo -->
  <text x="200" y="108" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">NES ADVANTAGE</text>

  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaa" text-anchor="middle">NES Advantage Controller — 1987</text>
</svg>