<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a1a1a"/>
  
  <!-- Phone body tall -->
  <rect x="150" y="30" width="100" height="240" rx="12" fill="#888"/>
  <rect x="150" y="30" width="100" height="15" rx="6" fill="#777"/>
  <!-- Antenna -->
  <rect x="188" y="10" width="10" height="30" rx="5" fill="#666"/>
  <!-- Earpiece -->
  <rect x="163" y="50" width="74" height="12" rx="5" fill="#555"/>
  <rect x="170" y="53" width="60" height="6" rx="3" fill="#444"/>
  <!-- Display -->
  <rect x="158" y="70" width="84" height="30" rx="4" fill="#1a3a1a"/>
  <text x="200" y="90" font-family="monospace" font-size="11" fill="#00cc44" text-anchor="middle">MOTOROLA</text>
  <!-- Keypad -->
  <g fill="#777" stroke="#666" stroke-width="0.5">
    <rect x="163" y="110" width="20" height="14" rx="2"/>
    <rect x="190" y="110" width="20" height="14" rx="2"/>
    <rect x="217" y="110" width="20" height="14" rx="2"/>
    <rect x="163" y="130" width="20" height="14" rx="2"/>
    <rect x="190" y="130" width="20" height="14" rx="2"/>
    <rect x="217" y="130" width="20" height="14" rx="2"/>
    <rect x="163" y="150" width="20" height="14" rx="2"/>
    <rect x="190" y="150" width="20" height="14" rx="2"/>
    <rect x="217" y="150" width="20" height="14" rx="2"/>
    <rect x="163" y="170" width="20" height="14" rx="2"/>
    <rect x="190" y="170" width="20" height="14" rx="2"/>
    <rect x="217" y="170" width="20" height="14" rx="2"/>
  </g>
  <!-- Key numbers -->
  <text x="173" y="121" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">1</text>
  <text x="200" y="121" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">2</text>
  <text x="227" y="121" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">3</text>
  <!-- Mouthpiece -->
  <rect x="163" y="215" width="74" height="30" rx="5" fill="#555"/>
  <g stroke="#666" stroke-width="1">
    <line x1="170" y1="222" x2="230" y2="222"/>
    <line x1="170" y1="228" x2="230" y2="228"/>
    <line x1="170" y1="234" x2="230" y2="234"/>
    <line x1="170" y1="240" x2="230" y2="240"/>
  </g>

  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Motorola DynaTAC 8000X — 1983</text>
</svg>