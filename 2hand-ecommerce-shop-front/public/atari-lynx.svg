<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#111"/>
  
  <rect x="30" y="80" width="340" height="170" rx="20" fill="#333"/>
  <rect x="30" y="80" width="340" height="20" rx="10" fill="#2a2a2a"/>
  <!-- Screen -->
  <rect x="100" y="95" width="200" height="130" rx="8" fill="#111"/>
  <rect x="108" y="102" width="184" height="116" rx="5" fill="#0a1a0a"/>
  <text x="200" y="168" font-family="Arial" font-size="16" font-weight="bold" fill="#ffaa00" text-anchor="middle">ATARI</text>
  <text x="200" y="185" font-family="Arial" font-size="11" fill="#cc8800" text-anchor="middle">Lynx</text>
  <!-- D-pad left -->
  <rect x="42" y="140" width="14" height="40" rx="3" fill="#222"/>
  <rect x="35" y="147" width="28" height="26" rx="3" fill="#222"/>
  <circle cx="49" cy="160" r="8" fill="#444"/>
  <!-- Buttons right -->
  <circle cx="310" cy="145" r="12" fill="#aa0000"/>
  <circle cx="335" cy="160" r="12" fill="#004400"/>
  <circle cx="310" cy="175" r="12" fill="#000088"/>
  <!-- Option buttons -->
  <rect x="155" y="210" width="30" height="12" rx="3" fill="#555"/>
  <rect x="215" y="210" width="30" height="12" rx="3" fill="#555"/>
  <!-- ATARI text -->
  <text x="49" y="230" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">D-PAD</text>

  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Atari Lynx — 1989</text>
</svg>