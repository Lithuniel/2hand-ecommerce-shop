<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#111"/>
  
  <rect x="40" y="90" width="320" height="140" rx="10" fill="#111"/>
  <rect x="40" y="90" width="320" height="15" rx="5" fill="#1a1a1a"/>
  <!-- Cartridge slot top -->
  <rect x="100" y="75" width="200" height="20" rx="5" fill="#0a0a0a"/>
  <rect x="110" y="78" width="180" height="12" rx="3" fill="#1a1a1a"/>
  <!-- SEGA logo -->
  <text x="200" y="140" font-family="Arial" font-size="28" font-weight="bold" fill="#3366ff" text-anchor="middle">SEGA</text>
  <text x="200" y="160" font-family="Arial" font-size="11" fill="#5588ff" text-anchor="middle">GENESIS</text>
  <!-- Buttons -->
  <circle cx="310" cy="130" r="8" fill="#222" stroke="#3366ff" stroke-width="2"/>
  <circle cx="310" cy="110" r="6" fill="#cc0000"/>
  <!-- Controller ports -->
  <rect x="60" y="190" width="45" height="22" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <rect x="115" y="190" width="45" height="22" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <!-- Volume slider -->
  <rect x="220" y="195" width="80" height="10" rx="3" fill="#1a1a1a"/>
  <rect x="250" y="192" width="10" height="16" rx="2" fill="#555"/>

  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Sega Genesis — 1988</text>
</svg>