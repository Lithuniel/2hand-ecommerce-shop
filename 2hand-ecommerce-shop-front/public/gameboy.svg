<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#111"/>
  
  <rect x="130" y="30" width="140" height="250" rx="15" fill="#9aaa9a"/>
  <rect x="130" y="30" width="140" height="18" rx="8" fill="#8a9a8a"/>
  <!-- Screen bezel -->
  <rect x="143" y="55" width="114" height="95" rx="6" fill="#7a8a7a"/>
  <rect x="150" y="62" width="100" height="81" rx="4" fill="#1a1a1a"/>
  <!-- Screen -->
  <rect x="153" y="65" width="94" height="75" rx="3" fill="#8fbc8f"/>
  <text x="200" y="106" font-family="monospace" font-size="12" fill="#2a4a2a" text-anchor="middle">GAME BOY</text>
  <!-- Nintendo -->
  <text x="200" y="172" font-family="Arial" font-size="8" fill="#6a7a6a" text-anchor="middle">Nintendo</text>
  <text x="200" y="184" font-family="Arial" font-size="9" font-weight="bold" fill="#5a6a5a" text-anchor="middle">GAME BOY</text>
  <!-- D-pad -->
  <rect x="148" y="205" width="12" height="36" rx="3" fill="#5a6a5a"/>
  <rect x="139" y="214" width="30" height="18" rx="3" fill="#5a6a5a"/>
  <circle cx="154" cy="223" r="7" fill="#4a5a4a"/>
  <!-- A B buttons -->
  <circle cx="272" cy="215" r="13" fill="#cc0000"/>
  <text x="272" y="220" font-family="Arial" font-size="10" font-weight="bold" fill="white" text-anchor="middle">A</text>
  <circle cx="251" cy="232" r="13" fill="#cc0000"/>
  <text x="251" y="237" font-family="Arial" font-size="10" font-weight="bold" fill="white" text-anchor="middle">B</text>
  <!-- Select Start -->
  <rect x="168" y="248" width="20" height="7" rx="3" fill="#7a8a7a"/>
  <rect x="212" y="248" width="20" height="7" rx="3" fill="#7a8a7a"/>
  <!-- Speaker dots -->
  <g fill="#8a9a8a">
    <circle cx="248" cy="264" r="3"/>
    <circle cx="258" cy="264" r="3"/>
    <circle cx="268" cy="264" r="3"/>
    <circle cx="248" cy="274" r="3"/>
    <circle cx="258" cy="274" r="3"/>
    <circle cx="268" cy="274" r="3"/>
  </g>

  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Vintage Game Boy — 1989</text>
</svg>