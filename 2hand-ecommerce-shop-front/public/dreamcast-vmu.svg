<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#111"/>
  
  <rect x="130" y="50" width="140" height="220" rx="12" fill="#e8e8e8"/>
  <rect x="130" y="50" width="140" height="18" rx="6" fill="#d8d8d8"/>
  <!-- Screen -->
  <rect x="145" y="75" width="110" height="80" rx="6" fill="#1a1a1a"/>
  <rect x="150" y="80" width="100" height="70" rx="4" fill="#1a3a1a"/>
  <text x="200" y="118" font-family="monospace" font-size="11" fill="#00cc44" text-anchor="middle">SEGA</text>
  <text x="200" y="133" font-family="monospace" font-size="8" fill="#00aa33" text-anchor="middle">VMU</text>
  <!-- D-pad -->
  <rect x="147" y="175" width="10" height="30" rx="2" fill="#ccc"/>
  <rect x="140" y="182" width="24" height="16" rx="2" fill="#ccc"/>
  <!-- A B buttons -->
  <circle cx="270" cy="185" r="12" fill="#ff6600"/>
  <text x="270" y="190" font-family="Arial" font-size="10" font-weight="bold" fill="white" text-anchor="middle">A</text>
  <circle cx="248" cy="200" r="12" fill="#ff6600"/>
  <text x="248" y="205" font-family="Arial" font-size="10" font-weight="bold" fill="white" text-anchor="middle">B</text>
  <!-- Memory slot connector -->
  <rect x="155" y="255" width="90" height="12" rx="3" fill="#bbb"/>
  <g fill="#999">
    <rect x="160" y="258" width="5" height="6" rx="1"/>
    <rect x="170" y="258" width="5" height="6" rx="1"/>
    <rect x="180" y="258" width="5" height="6" rx="1"/>
    <rect x="190" y="258" width="5" height="6" rx="1"/>
    <rect x="200" y="258" width="5" height="6" rx="1"/>
    <rect x="210" y="258" width="5" height="6" rx="1"/>
    <rect x="220" y="258" width="5" height="6" rx="1"/>
    <rect x="230" y="258" width="5" height="6" rx="1"/>
  </g>
  <!-- Sega logo -->
  <text x="200" y="155" font-family="Arial" font-size="9" font-weight="bold" fill="#ff6600" text-anchor="middle">Dreamcast</text>

  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Sega Dreamcast VMU — 1998</text>
</svg>