<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a0a0a"/>
  
  <!-- Body leather-look -->
  <rect x="90" y="70" width="220" height="190" rx="10" fill="#8B4513"/>
  <rect x="90" y="70" width="220" height="10" rx="5" fill="#7a3a10"/>
  <!-- Lens -->
  <circle cx="200" cy="175" r="50" fill="#333" stroke="#888" stroke-width="3"/>
  <circle cx="200" cy="175" r="40" fill="#222" stroke="#666" stroke-width="1"/>
  <circle cx="200" cy="175" r="28" fill="#1a1a2a"/>
  <circle cx="200" cy="175" r="18" fill="#0a0a14"/>
  <circle cx="200" cy="175" r="8" fill="#050508"/>
  <circle cx="188" cy="163" r="7" fill="white" opacity="0.12"/>
  <!-- Viewfinder -->
  <rect x="94" y="78" width="35" height="25" rx="4" fill="#5a2a08" stroke="#8a5020" stroke-width="1"/>
  <rect x="97" y="81" width="29" height="19" rx="3" fill="#1a1a2a"/>
  <!-- Film slot bottom -->
  <rect x="95" y="248" width="210" height="8" rx="3" fill="#5a2a08"/>
  <!-- Silver trim -->
  <rect x="90" y="110" width="220" height="4" fill="#c8c8a0"/>
  <!-- Polaroid text -->
  <text x="200" y="105" font-family="Arial" font-size="13" font-weight="bold" fill="#c8b880" text-anchor="middle">Polaroid SX-70</text>

  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Polaroid SX-70 — 1972</text>
</svg>