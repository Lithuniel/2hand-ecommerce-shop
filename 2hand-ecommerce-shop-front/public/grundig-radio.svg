<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#1a1008"/>
  
  <rect x="40" y="60" width="320" height="200" rx="12" fill="#5c3a0a"/>
  <rect x="40" y="60" width="320" height="15" rx="6" fill="#4a2e08"/>
  <!-- Speaker grille -->
  <rect x="55" y="80" width="150" height="140" rx="8" fill="#3a2508"/>
  <g stroke="#6a4a18" stroke-width="1.5">
    <line x1="65" y1="88" x2="65" y2="212"/>
    <line x1="80" y1="88" x2="80" y2="212"/>
    <line x1="95" y1="88" x2="95" y2="212"/>
    <line x1="110" y1="88" x2="110" y2="212"/>
    <line x1="125" y1="88" x2="125" y2="212"/>
    <line x1="140" y1="88" x2="140" y2="212"/>
    <line x1="155" y1="88" x2="155" y2="212"/>
    <line x1="170" y1="88" x2="170" y2="212"/>
    <line x1="185" y1="88" x2="185" y2="212"/>
  </g>
  <!-- Dial -->
  <rect x="220" y="80" width="125" height="60" rx="5" fill="#c8a840"/>
  <rect x="225" y="85" width="115" height="50" rx="3" fill="#e8c850"/>
  <line x1="245" y1="110" x2="325" y2="110" stroke="#8a6010" stroke-width="1"/>
  <text x="260" y="108" font-family="Arial" font-size="7" fill="#5a3a08">MW</text>
  <text x="290" y="108" font-family="Arial" font-size="7" fill="#5a3a08">UKW</text>
  <line x1="270" y1="90" x2="270" y2="130" stroke="#cc2200" stroke-width="2"/>
  <!-- Knobs -->
  <circle cx="240" cy="175" r="22" fill="#3a2508" stroke="#8a6010" stroke-width="3"/>
  <circle cx="240" cy="175" r="12" fill="#2a1808"/>
  <circle cx="310" cy="175" r="22" fill="#3a2508" stroke="#8a6010" stroke-width="3"/>
  <circle cx="310" cy="175" r="12" fill="#2a1808"/>
  <!-- Brand -->
  <text x="283" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#3a2508" text-anchor="middle">GRUNDIG</text>

  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Vintage Grundig Radio — 1960s</text>
</svg>