<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#111"/>
  
  <rect x="30" y="40" width="340" height="240" rx="6" fill="#1a1a1a"/>
  <rect x="30" y="40" width="340" height="8" fill="#333"/>
  <!-- Platter -->
  <circle cx="180" cy="160" r="100" fill="#111" stroke="#444" stroke-width="2"/>
  <circle cx="180" cy="160" r="90" fill="#0a0a0a" stroke="#333" stroke-width="1"/>
  <!-- Vinyl grooves -->
  <circle cx="180" cy="160" r="80" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="180" cy="160" r="70" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="180" cy="160" r="60" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="180" cy="160" r="50" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="180" cy="160" r="40" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="180" cy="160" r="30" fill="#cc0000"/>
  <circle cx="180" cy="160" r="20" fill="#aa0000"/>
  <text x="180" y="158" font-family="Arial" font-size="6" fill="white" text-anchor="middle">TECHNICS</text>
  <text x="180" y="167" font-family="Arial" font-size="5" fill="white" text-anchor="middle">SL-1200</text>
  <circle cx="180" cy="160" r="5" fill="#888"/>
  <!-- Tonearm -->
  <line x1="310" y1="80" x2="230" y2="175" stroke="#aaa" stroke-width="3"/>
  <circle cx="310" cy="80" r="12" fill="#333" stroke="#888" stroke-width="2"/>
  <circle cx="228" cy="177" r="6" fill="#ccc"/>
  <!-- Controls -->
  <circle cx="310" cy="155" r="15" fill="#222" stroke="#555" stroke-width="2"/>
  <circle cx="310" cy="155" r="6" fill="#555"/>
  <rect x="290" y="195" width="50" height="15" rx="3" fill="#333"/>
  <rect x="295" y="198" width="15" height="9" rx="2" fill="#00cc44"/>

  <text x="200" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaa" text-anchor="middle">Technics Turntable — 1972</text>
</svg>